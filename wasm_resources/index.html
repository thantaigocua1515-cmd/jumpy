<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#001e36" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/player/skins/fishy/fishy-body.png" />
    <title>Fish Folk: Jumpy — Mobile</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        height: 100dvh;
        height: calc(var(--vvh, 1vh) * 100);
        background-color: black;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
        position: fixed;
        inset: 0;
        touch-action: none;
        overscroll-behavior: none;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      }
      canvas {
        background-color: black;
        display: block;
        width: 100vw !important;
        height: calc(var(--vvh, 1vh) * 100) !important;
        object-fit: contain;
      }
    </style>
    <!-- Nifty spinner from: https://github.com/loadingio/css-spinner/blob/088defa790d015e9c7df664d426374952e65124a/dist/dual-ring.html#L1 -->
    <style type="text/css">
      .lds-dual-ring {
        width: 80px;
        height: 80px;
      }
      .lds-dual-ring:after {
        content: " ";
        display: block;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 6px solid #fff;
        border-color: #fff transparent #fff transparent;
        animation: lds-dual-ring 1.2s linear infinite;
      }
      @keyframes lds-dual-ring {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .loading-container {
        z-index: 5;
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 0; bottom: 0; left: 0; right: 0;
        color: white;
        pointer-events: none;
      }
      .loading-container > div {
        margin: auto;
        display: flex;
        flex-direction: column;
        color: white;
        align-items: center;
        padding: 0 16px;
        text-align: center;
      }
      .loading-text { margin-top: 2em; font-size: 1.2em; }
      .loading-progress {
        margin-top: 14px;
        width: min(320px, 70vw);
        height: 8px;
        border-radius: 4px;
        background: rgba(255,255,255,0.18);
        overflow: hidden;
      }
      .loading-progress > div {
        height: 100%;
        width: 0%;
        background: #3ec761;
        transition: width 0.2s ease;
      }
      .loading-pct { margin-top: 8px; font-size: 0.95em; color: #bfe3ff; min-height: 1.2em; }
      .loading-tip { margin-top: 10px; font-size: 0.85em; color: #8fa9bd; }
    </style>
    <style>
      /* ---------- On-screen touch gamepad ---------- */
      #toolbar {
        position: fixed;
        top: calc(8px + env(safe-area-inset-top));
        right: calc(8px + env(safe-area-inset-right));
        z-index: 30;
        display: flex;
        gap: 8px;
      }
      #toolbar button {
        width: 42px; height: 42px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.35);
        background: rgba(10, 25, 40, 0.55);
        color: #fff;
        font-size: 19px;
        line-height: 1;
        padding: 0;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #toolbar button:active { background: rgba(62,199,97,0.5); }

      #pads {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        display: none;
      }
      #pads.on { display: block; }
      .pad-cluster { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: flex-end; }
      .pad-left { left: calc(12px + env(safe-area-inset-left)); }
      .pad-right { right: calc(12px + env(safe-area-inset-right)); }
      .pad-col { display: flex; flex-direction: column; gap: 10px; align-items: center; }
      .pad-row { display: flex; gap: 10px; }
      .pad-btn {
        pointer-events: auto;
        width: 60px; height: 60px;
        border-radius: 50%;
        border: 1.5px solid rgba(255,255,255,0.4);
        background: rgba(10, 25, 40, 0.45);
        color: #fff;
        font-size: 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      .pad-btn small { font-size: 9px; letter-spacing: 0.4px; color: #bfe3ff; margin-top: 1px; }
      .pad-btn.pressed { background: rgba(62,199,97,0.55); border-color: #3ec761; }
      .pad-btn.big { width: 68px; height: 68px; font-size: 24px; }
      .pad-btn.small { width: 46px; height: 46px; font-size: 16px; }
      .pad-top {
        position: absolute;
        top: calc(8px + env(safe-area-inset-top));
        left: calc(12px + env(safe-area-inset-left));
        display: flex; gap: 10px;
      }
      #rotate-hint {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(120px + env(safe-area-inset-bottom));
        z-index: 25;
        background: rgba(10, 25, 40, 0.8);
        color: #fff;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 13px;
        display: none;
        pointer-events: none;
        white-space: nowrap;
      }
      @media (orientation: portrait) {
        #rotate-hint.show { display: block; }
      }

      /* ---------- Swipe joystick zone ---------- */
      #joy-zone {
        position: absolute;
        left: 0; bottom: 0;
        width: 46%; height: 64%;
        pointer-events: auto;
        touch-action: none;
      }
      #joy-base {
        position: absolute;
        width: 112px; height: 112px;
        margin: -56px 0 0 -56px;
        border-radius: 50%;
        border: 1.5px solid rgba(255,255,255,0.35);
        background: rgba(10, 25, 40, 0.30);
        display: none;
      }
      #joy-nub {
        position: absolute;
        left: 50%; top: 50%;
        width: 52px; height: 52px;
        margin: -26px 0 0 -26px;
        border-radius: 50%;
        background: rgba(255,255,255,0.35);
        border: 1.5px solid rgba(255,255,255,0.5);
      }
      #joy-hint {
        position: absolute;
        left: calc(14px + env(safe-area-inset-left));
        bottom: calc(16px + env(safe-area-inset-bottom));
        color: rgba(255,255,255,0.6);
        font-size: 12px;
        letter-spacing: 0.5px;
        background: rgba(10, 25, 40, 0.35);
        padding: 6px 10px;
        border-radius: 999px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <script>
      // Keep the game canvas fitted to the *visible* viewport on mobile
      // (handles browser URL bar show/hide + rotation): expose the visible
      // height as --vvh and nudge the game to resize along with it.
      (function () {
        function fit() {
          var vv = window.visualViewport;
          var h = vv ? vv.height : window.innerHeight;
          document.documentElement.style.setProperty('--vvh', (h / 100) + 'px');
        }
        fit();
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', function () {
            fit();
            window.dispatchEvent(new Event('resize'));
          });
        }
        window.addEventListener('orientationchange', function () {
          setTimeout(function () { fit(); window.dispatchEvent(new Event('resize')); }, 300);
        });
      })();
    </script>
    <div class="loading-container">
      <div>
        <div class="lds-dual-ring"></div>
        <div class="loading-text">Loading game...</div>
        <div class="loading-progress"><div id="load-bar"></div></div>
        <div class="loading-pct" id="load-pct"></div>
        <div class="loading-tip">Lần tải đầu hơi lâu — các lần sau sẽ nhanh hơn nhờ bộ nhớ đệm.</div>
      </div>
    </div>

    <div id="toolbar">
      <button id="btn-pads" title="Bật/tắt nút cảm ứng">🎮</button>
      <button id="btn-full" title="Toàn màn hình">⛶</button>
    </div>

    <div id="rotate-hint">📱 Xoay ngang điện thoại để chơi thoải mái hơn</div>

    <!-- Touch gamepad: maps to Player 1 keyboard defaults (assets/game.yaml):
         move W/A/S/D, jump Space, shoot C, grab V, slide B, pause Esc, start Enter -->
    <div id="pads">
      <div class="pad-top">
        <div class="pad-btn small" data-key="Escape" data-code="Escape">⏸<small>PAUSE</small></div>
        <div class="pad-btn small" data-key="Enter" data-code="Enter">⏵<small>START</small></div>
      </div>
      <div id="joy-zone">
        <div id="joy-base"><div id="joy-nub"></div></div>
        <div id="joy-hint">✥ VUỐT ĐỂ DI CHUYỂN · HẤT LÊN = NHẢY</div>
      </div>
      <div class="pad-cluster pad-right">
        <div class="pad-col">
          <div class="pad-row">
            <div class="pad-btn" data-key="v" data-code="KeyV">✋<small>NHẶT</small></div>
            <div class="pad-btn" data-key="b" data-code="KeyB">➘<small>TRƯỢT</small></div>
          </div>
          <div class="pad-row">
            <div class="pad-btn big" data-key="c" data-code="KeyC">🔫<small>BẮN</small></div>
            <div class="pad-btn big" data-key=" " data-code="Space">⬆<small>NHẢY</small></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ---- Aggregate download progress (WASM + game assets) ----
      (function () {
        var TOTAL_BYTES = 39515413; // approx. size of the whole web build
        var bar = document.getElementById('load-bar');
        var pct = document.getElementById('load-pct');
        var got = 0;
        var lastActivity = Date.now();
        function render() {
          var p = Math.max(0, Math.min(100, Math.round((got / TOTAL_BYTES) * 100)));
          if (bar) bar.style.width = p + '%';
          if (pct) pct.textContent = 'Đang tải game: ' + p + '%';
        }
        render();
        var origFetch = window.fetch.bind(window);
        window.fetch = function () {
          var args = arguments;
          return origFetch.apply(null, args).then(function (resp) {
            try {
              if (resp && resp.body && resp.clone) {
                var reader = resp.clone().body.getReader();
                (function pump() {
                  reader.read().then(function (r) {
                    if (r.done) return;
                    got += r.value.byteLength;
                    lastActivity = Date.now();
                    render();
                    pump();
                  }).catch(function () {});
                })();
              }
            } catch (e) {}
            return resp;
          });
        };
        // Hide the overlay once the game canvas is up and downloads have
        // finished or gone quiet (assets the game loads outside fetch).
        var t0 = Date.now();
        var timer = setInterval(function () {
          var c = document.querySelector('canvas');
          if (!c || !(c.width > 0)) return;
          var quiet = Date.now() - lastActivity > 4000;
          var done = got >= TOTAL_BYTES * 0.995;
          if ((quiet && got > 1000000) || done || Date.now() - t0 > 240000) {
            var lc = document.querySelector('.loading-container');
            if (lc) lc.style.display = 'none';
            clearInterval(timer);
          }
        }, 500);
      })();
    </script>
    <script>
      // Insert hack to make sound autoplay on Chrome as soon as the user interacts with the tab:
      // https://developers.google.com/web/updates/2018/11/web-audio-autoplay#moving-forward
      (function () {
        const audioContextList = [];
        const userInputEventNames = [
          "click", "contextmenu", "auxclick", "dblclick", "mousedown", "mouseup",
          "pointerup", "touchend", "keydown", "keyup",
        ];
        self.AudioContext = new Proxy(self.AudioContext, {
          construct(target, args) {
            const result = new target(...args);
            audioContextList.push(result);
            return result;
          },
        });
        function resumeAllContexts(event) {
          let count = 0;
          audioContextList.forEach((context) => {
            if (context.state !== "running") { context.resume(); } else { count++; }
          });
          if (count && count == audioContextList.length) {
            userInputEventNames.forEach((eventName) => {
              document.removeEventListener(eventName, resumeAllContexts);
            });
          }
        }
        userInputEventNames.forEach((eventName) => {
          document.addEventListener(eventName, resumeAllContexts);
        });
      })();
    </script>
    <script>
      // ---------- Touch controls: swipe joystick (movement) + buttons (actions) ----------
      (function () {
        var pads = document.getElementById('pads');
        var hint = document.getElementById('rotate-hint');
        var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        var forced = new URLSearchParams(location.search).get('pads');
        var pref = localStorage.getItem('jumpy_pads');
        var on = forced !== null ? forced === '1' : (pref !== null ? pref === '1' : isTouch);
        function apply() {
          pads.classList.toggle('on', on);
          hint.classList.toggle('show', on);
        }
        apply();

        document.getElementById('btn-pads').addEventListener('click', function () {
          on = !on;
          localStorage.setItem('jumpy_pads', on ? '1' : '0');
          apply();
        });
        document.getElementById('btn-full').addEventListener('click', function () {
          try {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(function () { document.documentElement.requestFullscreen(); });
          } catch (e) {}
        });

        // --- Synthetic keyboard state manager ---
        // Player 1 defaults (assets/game.yaml): WASD move, Space jump, C shoot,
        // V grab, B slide, Esc pause, Enter start/confirm.
        var KEYCODES = { KeyW: 87, KeyA: 65, KeyS: 83, KeyD: 68, KeyC: 67, KeyV: 86, KeyB: 66, Space: 32, Escape: 27, Enter: 13 };
        var KEYVALS = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd', KeyC: 'c', KeyV: 'v', KeyB: 'b', Space: ' ', Escape: 'Escape', Enter: 'Enter' };
        var held = {};
        function eventTarget() { return document.querySelector('canvas') || document.body; }
        function dispatchKey(type, code) {
          var ev = new KeyboardEvent(type, { key: KEYVALS[code], code: code, bubbles: true, cancelable: true, composed: true });
          try {
            Object.defineProperty(ev, 'keyCode', { get: function () { return KEYCODES[code] || 0; } });
            Object.defineProperty(ev, 'which', { get: function () { return KEYCODES[code] || 0; } });
          } catch (e) {}
          eventTarget().dispatchEvent(ev);
        }
        function setKey(code, down) {
          if (!!held[code] === down) return;
          held[code] = down;
          dispatchKey(down ? 'keydown' : 'keyup', code);
        }
        function tapKey(code) {
          setKey(code, true);
          setTimeout(function () { setKey(code, false); }, 120);
        }

        // --- Action buttons (right cluster + pause/start) ---
        document.querySelectorAll('.pad-btn').forEach(function (btn) {
          var code = btn.getAttribute('data-code');
          btn.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            try { btn.setPointerCapture(e.pointerId); } catch (err) {}
            btn.classList.add('pressed');
            setKey(code, true);
          });
          function release() {
            if (!btn.classList.contains('pressed')) return;
            btn.classList.remove('pressed');
            setKey(code, false);
          }
          btn.addEventListener('pointerup', release);
          btn.addEventListener('pointercancel', release);
          btn.addEventListener('lostpointercapture', release);
          btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        });

        // --- Swipe joystick for movement (left zone) ---
        // Drag in any direction: horizontal = walk, up = aim up, down = crouch.
        // A quick flick up also triggers a jump tap.
        var DEAD = 13, RADIUS = 48;
        function dirKeys(dx, dy) {
          return { KeyA: dx < -DEAD, KeyD: dx > DEAD, KeyW: dy < -DEAD, KeyS: dy > DEAD };
        }
        window.__joyDirKeys = dirKeys; // exposed for automated tests

        var zone = document.getElementById('joy-zone');
        var base = document.getElementById('joy-base');
        var nub = document.getElementById('joy-nub');
        var joyId = null, ox = 0, oy = 0, startT = 0, lastDx = 0, lastDy = 0;
        var moved = false, maxLen = 0, joyType = 'touch';

        function joyMove(e) {
          var dx = e.clientX - ox, dy = e.clientY - oy;
          lastDx = dx; lastDy = dy;
          var k = dirKeys(dx, dy);
          for (var code in k) setKey(code, k[code]);
          var len = Math.sqrt(dx * dx + dy * dy);
          if (len > maxLen) maxLen = len;
          if (len > 12) { moved = true; base.style.display = 'block'; }
          var cl = Math.min(len, RADIUS);
          var a = Math.atan2(dy, dx);
          nub.style.transform = 'translate(' + (Math.cos(a) * cl) + 'px,' + (Math.sin(a) * cl) + 'px)';
        }
        // A tap that never turned into a drag belongs to the game UI (menus
        // live under this zone on the left side), so forward it to the canvas.
        function forwardTap(x, y) {
          var c = document.querySelector('canvas');
          if (!c) return;
          var baseOpts = { bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0, pointerId: 987, pointerType: joyType, isPrimary: true };
          c.dispatchEvent(new PointerEvent('pointerdown', Object.assign({}, baseOpts, { buttons: 1 })));
          c.dispatchEvent(new MouseEvent('mousedown', Object.assign({}, baseOpts, { buttons: 1 })));
          c.dispatchEvent(new PointerEvent('pointerup', Object.assign({}, baseOpts, { buttons: 0 })));
          c.dispatchEvent(new MouseEvent('mouseup', Object.assign({}, baseOpts, { buttons: 0 })));
          c.dispatchEvent(new MouseEvent('click', Object.assign({}, baseOpts, { buttons: 0 })));
        }
        function joyEnd() {
          if (joyId === null) return;
          var dt = performance.now() - startT;
          var flickUp = dt < 260 && lastDy < -52;
          var wasTap = !moved && dt < 500;
          joyId = null;
          base.style.display = 'none';
          nub.style.transform = 'translate(0px,0px)';
          setKey('KeyA', false); setKey('KeyD', false); setKey('KeyW', false); setKey('KeyS', false);
          if (flickUp) tapKey('Space');
          else if (wasTap) forwardTap(ox, oy);
        }
        zone.addEventListener('pointerdown', function (e) {
          if (joyId !== null) return;
          e.preventDefault();
          joyId = e.pointerId;
          ox = e.clientX; oy = e.clientY;
          startT = performance.now();
          lastDx = 0; lastDy = 0;
          moved = false; maxLen = 0; joyType = e.pointerType || 'touch';
          try { zone.setPointerCapture(e.pointerId); } catch (err) {}
          base.style.left = ox + 'px';
          base.style.top = oy + 'px';
          joyMove(e);
        });
        zone.addEventListener('pointermove', function (e) {
          if (e.pointerId !== joyId) return;
          joyMove(e);
        });
        zone.addEventListener('pointerup', function (e) { if (e.pointerId === joyId) joyEnd(); });
        zone.addEventListener('pointercancel', function (e) { if (e.pointerId === joyId) joyEnd(); });
        zone.addEventListener('lostpointercapture', function () { joyEnd(); });
        zone.addEventListener('contextmenu', function (e) { e.preventDefault(); });

        // Stop double-tap zoom / scroll gestures on the controls.
        ['touchstart', 'touchmove'].forEach(function (t) {
          document.addEventListener(t, function (e) {
            if (e.target.closest && (e.target.closest('#pads') || e.target.closest('#toolbar'))) e.preventDefault();
          }, { passive: false });
        });
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    </script>
    <script type="module">
      import init from "./jumpy.js";
      init();
      const ignoreCanvasContextMenu = () => {
        const canvases = document.getElementsByTagName('canvas');
        if (canvases[0]) {
            canvases[0].oncontextmenu = (e) => { e.preventDefault() }
        } else {
            setTimeout(ignoreCanvasContextMenu, 1000)
        }
      };
      setTimeout(ignoreCanvasContextMenu, 1000)
    </script>
  </body>
</html>
